# Render — https://render.com/docs/blueprint-spec
# OCR (Tesseract) exige runtime Docker — ver backend/Dockerfile

services:
  - type: web
    name: acc-nomad
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      - key: LLM_PROVIDER
        value: anthropic
      - key: ANTHROPIC_MODEL_FAST
        value: claude-haiku-4-5
